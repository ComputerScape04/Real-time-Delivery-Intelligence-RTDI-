spring.application.name=rtdi-platform

# local dev authentication credentials
spring.security.user.name=admin
spring.security.user.password=admin123

# postgres credentials (in docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/rtdi_db
spring.datasource.username=postgres
spring.datasource.password=password123

# redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# kafka
spring.kafka.bootstrap-servers=localhost:9092

# Hibernate schema validation against Flyway
# setting it to validate means that hibernate won't create its own schema and will
# instead validate flyway generated schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Active profile (dev = testing, prod = real world env)
spring.profiles.active=dev

# M2M API Security
rtdi.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
rtdi.jwt.expiration-ms=360000