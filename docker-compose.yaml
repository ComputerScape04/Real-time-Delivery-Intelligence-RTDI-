# DISCLAIMER:
# since I'm using dummy data for this project, the passwords are hard-coded
# use .env file to store secrets and keys and use docker compose variables to pass them onto the containers.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rtdi-postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: rtdi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
  kafka:
    image: apache/kafka:latest
    container_name: rtdi-kafka
    ports:
      - "9092:9092"
    environment:
      # configuring listeners  
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      # setting for KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # required for single node cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  redis:
    image: redis:latest
    container_name: rtdi-redis
    ports:
      - "6379:6379"
volumes:
  pgdata: